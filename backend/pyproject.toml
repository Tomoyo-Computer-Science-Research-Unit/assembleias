[project]
name = "assembleias-backend"
version = "0.1.0"
description = "ETL: ALERJ and ALESP -> normalized JSON snapshots for the Assembleias site"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "lxml>=5.0",
    "beautifulsoup4>=4.12",
    "pillow>=10",
    "pdfplumber>=0.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
